# ─────────────────────────────────────────────────────────────────────
# INSIGHT · stack de desenvolvimento
# Sobe Redis + API + Web em containers locais
# Para produção: combine com docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: insight-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - insight-net

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: development-api
    container_name: insight-api
    restart: unless-stopped
    env_file:
      - infra/docker/compose.stack.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=redis://redis:6379
    # Porta no host: usa HOST_API_PORT (evita conflito com API_PORT num .env antigo).
    # Dentro do container a API escuta em API_PORT definido em infra/docker/compose.stack.env (3002).
    ports:
      - '${HOST_API_PORT:-3002}:3002'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src:cached
      - ./packages:/app/packages:cached
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider "http://127.0.0.1:$${API_PORT}/api/v1/health" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - insight-net

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: development-web
    container_name: insight-web
    restart: unless-stopped
    env_file:
      - infra/docker/compose.stack.env
    environment:
      - VITE_API_BASE_URL=http://localhost:${HOST_API_PORT:-3002}/api/v1
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src:cached
      - ./packages:/app/packages:cached
    networks:
      - insight-net

  nginx:
    image: nginx:1.27-alpine
    container_name: insight-nginx
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - insight-net

volumes:
  redis-data:
    driver: local

networks:
  insight-net:
    driver: bridge
