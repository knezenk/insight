# ─────────────────────────────────────────────────────────────────────
# INSIGHT · nginx gateway de produção
# Faz reverse proxy para api (3001) e serve estáticos do web build
# ─────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ─────────────────────────────────────────────────────
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$request_uri",'
      '"status":$status,'
      '"size":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time"'
    '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  # ─── Performance ────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 16m;

  # ─── Gzip ────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/xml+rss application/rss+xml
    application/atom+xml image/svg+xml;

  # ─── Rate limiting (DDoS basics) ────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # ─── Upstream ────────────────────────────────────────────────────
  upstream insight_api {
    least_conn;
    server api:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ─── HTTP → HTTPS redirect ──────────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS server ───────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name insight.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_per_ip 50;

    # Frontend estático (SPA)
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }

    # Assets versionados
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # API proxy
    location /api/ {
      limit_req zone=api_general burst=50 nodelay;

      proxy_pass http://insight_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_connect_timeout 5s;
    }

    # Auth endpoints com rate limit mais agressivo
    location ~ ^/api/v1/auth/(login|register|refresh) {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://insight_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check público
    location /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
