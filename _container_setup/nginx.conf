# ─────────────────────────────────────────────────────────────────────
# nginx · server estático para o build do React/Vite
# Encaminha /api/ para o container "api"
# ─────────────────────────────────────────────────────────────────────

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Assets versionados (hash no filename)
  location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Proxy reverso para a API (container "api" na network insight-net)
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
  }

  # Health do próprio nginx
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Compressão
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/javascript text/xml
    application/json application/javascript application/xml
    application/xml+rss image/svg+xml;
}
