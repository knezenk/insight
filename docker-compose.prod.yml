version: '3.9'

# ─────────────────────────────────────────────────────────────────────
# OVERLAY de produção
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - LOG_PRETTY=false
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  web:
    build:
      target: production
    environment:
      - NODE_ENV=production
    restart: always

  nginx:
    profiles: []
    restart: always

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
